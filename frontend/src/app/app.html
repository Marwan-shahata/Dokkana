<app-navbar
  (loginClick)="openLogin()"
  (signUpClick)="openSignUp()"
  (openCartClick)="openCart()"
></app-navbar>

<router-outlet></router-outlet>

<app-footer></app-footer>

<app-login
  [isOpen]="showLogin"
  (closeModal)="closeLogin()"
  (goToSignUp)="switchToSignUp()"
></app-login>
<app-sign-up
  [isOpen]="showSignUp"
  (closeModal)="closeSignUp()"
  (goToLogin)="switchToLogin()"
></app-sign-up>

<app-cart
  *ngIf="isCartOpen"
  (close)="closeCart()"
></app-cart>
