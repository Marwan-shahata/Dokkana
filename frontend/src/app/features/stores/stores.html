<section class="stores-page" [class.rtl]="lang.isAr()">
  <header class="stores-head">
    <p class="eyebrow">{{ L('Discover', 'اكتشف') }}</p>
    <h1>{{ L('Local Stores', 'المحلات المحلية') }}</h1>
    <p class="sub">
      {{ L('Browse approved fashion shops near you.', 'تصفّح محلات الأزياء المعتمدة القريبة منك.') }}
    </p>
  </header>

  <!-- Loading -->
  <div class="state-grid" *ngIf="loading()">
    <div class="skeleton-card" *ngFor="let s of [1,2,3,4,5,6]"></div>
  </div>

  <!-- Error -->
  <div class="state-box error" *ngIf="!loading() && error()">
    <p>{{ error() }}</p>
    <button class="retry-btn" (click)="load()">{{ L('Retry', 'إعادة المحاولة') }}</button>
  </div>

  <!-- Empty -->
  <div class="state-box" *ngIf="!loading() && !error() && stores().length === 0">
    <p>{{ L('No stores available yet.', 'لا توجد محلات متاحة بعد.') }}</p>
  </div>

  <!-- Results -->
  <div class="store-grid" *ngIf="!loading() && !error() && stores().length > 0">
    <button class="store-card" *ngFor="let s of stores()" (click)="openStore(s)" type="button">
      <span class="logo" *ngIf="s.logoUrl"><img [src]="s.logoUrl" [alt]="s.name" /></span>
      <span class="logo placeholder" *ngIf="!s.logoUrl">{{ initials(s.name) }}</span>
      <span class="info">
        <span class="name">{{ s.name }}</span>
        <span class="addr" *ngIf="s.address">{{ s.address }}</span>
        <span class="desc" *ngIf="s.description">{{ s.description }}</span>
      </span>
    </button>
  </div>
</section>
