<div class="auth-stage">
  <!-- Persistent branded background — stays put while the card morphs -->
  <div class="auth-scene" aria-hidden="true">
    <div class="auth-orb auth-orb--clay"></div>
    <div class="auth-orb auth-orb--nile"></div>
    <div class="auth-orb auth-orb--ochre"></div>
  </div>

  <div class="auth-controls" [attr.aria-label]="L('Display settings', 'إعدادات العرض')">
    <button
      type="button"
      class="auth-control auth-control--icon"
      (click)="theme.toggle()"
      [attr.aria-label]="themeLabel()"
      [attr.title]="themeLabel()"
      [attr.aria-pressed]="theme.isDark()"
    >
      <svg *ngIf="!theme.isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
      </svg>
      <svg *ngIf="theme.isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4.5" />
        <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
      </svg>
    </button>

    <button
      type="button"
      class="auth-control auth-control--lang"
      (click)="lang.toggle()"
      [attr.aria-label]="languageLabel()"
      [attr.title]="languageLabel()"
      [attr.aria-pressed]="lang.isAr()"
    >
      {{ lang.isAr() ? 'EN' : 'العربية' }}
    </button>
  </div>

  <!-- Card stack: both wrappers share one grid cell so enter/leave cross-fade -->
  <div class="auth-stack">
    <div *ngIf="mode() === 'login'" class="auth-card-wrap" @cardSwap>
      <app-login
        [embedded]="true"
        [isOpen]="true"
        (goToSignUp)="switch('signup')"
        (closeModal)="goHome()"
      ></app-login>
    </div>

    <div *ngIf="mode() === 'signup'" class="auth-card-wrap" @cardSwap>
      <app-sign-up
        [embedded]="true"
        [isOpen]="true"
        (goToLogin)="switch('login')"
        (closeModal)="goHome()"
      ></app-sign-up>
    </div>
  </div>
</div>
