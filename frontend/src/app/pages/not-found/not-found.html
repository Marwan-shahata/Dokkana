<section class="notfound" [class.rtl]="lang.isAr()">
  <div class="nf-card">
    <span class="nf-code" aria-hidden="true">404</span>
    <h1>{{ L('This page wandered off', 'الصفحة دي مش موجودة') }}</h1>
    <p>{{ L('The page you are looking for does not exist or may have moved.', 'الصفحة اللي بتدوّر عليها مش موجودة أو اتنقلت.') }}</p>
    <div class="nf-actions">
      <a class="nf-btn primary" [routerLink]="homeRoute()">{{ L('Back to home', 'العودة للرئيسية') }}</a>
      <a class="nf-btn" routerLink="/stores">{{ L('Browse stores', 'تصفّح المحلات') }}</a>
    </div>
  </div>
</section>
