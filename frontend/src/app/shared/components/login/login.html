<div
  class="modal-backdrop"
  [class.is-open]="isOpen"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  aria-label="Sign in"
>
  <div class="modal-panel" [class.is-open]="isOpen">
    <button class="modal-close" type="button" (click)="close()" aria-label="Close">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <div class="modal-brand">
      <div class="brand-mark">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
      </div>
      <div class="brand-text"><b>Dokkana</b><span class="ar">دكانة</span></div>
    </div>

    <div class="modal-head">
      <div class="eyebrow"><i></i> Welcome back</div>
      <h2 class="modal-title">Sign in to your account</h2>
      <p class="modal-sub">Pick up right where you left off in Egypt's local fashion scene.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate autocomplete="on">
      <div class="field" [class.has-error]="fieldInvalid('email')">
        <label for="lm-email">Email Address</label>
        <div class="input-wrap">
          <svg
            class="input-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
          <input
            id="lm-email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>
        <div class="error-msg" *ngIf="fieldInvalid('email')">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <ng-container *ngIf="f['email'].errors?.['required']">Email is required.</ng-container>
          <ng-container *ngIf="f['email'].errors?.['email']">Enter a valid email.</ng-container>
        </div>
      </div>

      <div class="field" [class.has-error]="fieldInvalid('password')">
        <div class="field-header">
          <label for="lm-password">Password</label>
          <a href="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <svg
            class="input-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            id="lm-password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-vis"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide' : 'Show'"
          >
            <svg
              *ngIf="!showPassword"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg
              *ngIf="showPassword"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <div class="error-msg" *ngIf="fieldInvalid('password')">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <ng-container *ngIf="f['password'].errors?.['required']"
            >Password is required.</ng-container
          >
          <ng-container *ngIf="f['password'].errors?.['minlength']"
            >At least 6 characters.</ng-container
          >
        </div>
      </div>

      <div class="field remember-row">
        <label class="checkbox-label" for="lm-remember">
          <input id="lm-remember" type="checkbox" formControlName="rememberMe" class="sr-only" />
          <span class="custom-check" [class.checked]="form.get('rememberMe')?.value">
            <svg
              *ngIf="form.get('rememberMe')?.value"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </span>
          <span class="check-text">Keep me signed in</span>
        </label>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span [class.hidden]="isLoading">Sign In</span>
        <span [class.hidden]="!isLoading">Signing in…</span>
        <svg
          *ngIf="!isLoading"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
        <svg
          *ngIf="isLoading"
          class="spinner"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
        >
          <circle cx="12" cy="12" r="9" stroke-opacity="0.3" />
          <path d="M12 3a9 9 0 0 1 9 9" />
        </svg>
      </button>
    </form>

    <p class="modal-footer-link">
      Don't have an account?
      <button type="button" class="switch-btn" (click)="goToSignUp.emit()">Sign Up</button>
    </p>
  </div>
</div>
