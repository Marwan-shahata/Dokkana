<div class="bell-wrap">
  <button
    class="icon-btn bell"
    (click)="toggle()"
    [attr.aria-label]="L('Notifications','الإشعارات')"
    [attr.aria-expanded]="open"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="bell-count" *ngIf="notifications.unreadCount() > 0">
      {{ notifications.unreadCount() > 99 ? '99+' : notifications.unreadCount() }}
    </span>
  </button>

  <div class="panel" *ngIf="open">
    <div class="panel-head">
      <span class="panel-title">{{ L('Notifications','الإشعارات') }}</span>
      <button
        class="link-btn"
        *ngIf="notifications.unreadCount() > 0"
        (click)="markAll()"
      >{{ L('Mark all read','تعليم الكل كمقروء') }}</button>
    </div>

    <div class="panel-body">
      <p class="empty" *ngIf="notifications.items().length === 0">
        {{ L('No notifications yet','لا توجد إشعارات بعد') }}
      </p>

      <button
        type="button"
        class="item"
        *ngFor="let n of notifications.items()"
        [class.unread]="!n.isRead"
        (click)="onItemClick(n)"
      >
        <span class="dot" *ngIf="!n.isRead" aria-hidden="true"></span>
        <span class="item-main">
          <span class="item-title">
            <span class="sponsored-tag" *ngIf="n.isSponsored">{{ L('Sponsored', 'إعلان') }}</span>
            {{ n.title }}
          </span>
          <span class="item-msg">{{ n.message }}</span>
          <span class="item-time">{{ timeAgo(n.createdAt) }}</span>
        </span>
      </button>
    </div>
  </div>
</div>
